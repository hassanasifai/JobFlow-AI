name: Dependency Review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        # TODO(#343): remove continue-on-error once GitHub Dependency Graph is
        # enabled in Settings > Security & Analysis. Without the graph, the
        # action fails on every public-repo PR. Once enabled, drop this line so
        # high-severity vulnerabilities actually block merges.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce high or critical severity vulnerabilities.
          # Use 'moderate' if the project is highly security-sensitive.
          fail-on-severity: high
          comment-summary-in-pr: always
          # Refuse copyleft licenses that conflict with this project's MIT.
          # (GPL/AGPL/LGPL would force MIT downstream consumers to relicense.)
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
