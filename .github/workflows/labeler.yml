name: Label PRs

# pull_request_target is required so the labeler can write labels on PRs from
# forks (the default GITHUB_TOKEN under `pull_request` is read-only for forks).
# This workflow does NOT check out PR code — it only reads file paths from the
# PR metadata and applies labels based on .github/labeler.yml. No untrusted
# code execution path exists, so the elevated token is safe.
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
