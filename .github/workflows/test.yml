name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      # --ignore-scripts blocks postinstall hooks from transitive deps
      # (defense-in-depth against malicious package authors). Lockfile is
      # committed so `npm ci` is deterministic.
      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Install dashboard deps
        run: npm ci --ignore-scripts
        working-directory: dashboard-web

      - name: Verify pipeline integrity
        run: node verify-pipeline.mjs

      - name: Run integration check suite
        run: node test-all.mjs --quick

      - name: Run root unit tests
        run: npm test

      - name: Run dashboard unit tests
        run: npm test
        working-directory: dashboard-web

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard-web
